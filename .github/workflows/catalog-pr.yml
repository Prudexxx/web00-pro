name: web00-catalog-validate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web00-catalog-validate:
    name: web00-catalog-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Classify catalog publication PR
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.head_ref }}" == catalog/publish/* ]]; then
            echo "Catalog publication PR detected."
          else
            echo "Non-catalog PR: required web00-catalog-validate check passes without strict catalog validation."
          fi

      - name: Reject changes outside catalog publication scope
        if: ${{ startsWith(github.head_ref, 'catalog/publish/') }}
        shell: bash
        run: |
          set -euo pipefail

          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(catalog/cards/[^/]+\.json|scripts/build-pages-catalog\.mjs|tests/frontend/(pages-catalog-generator|catalog-api-client|catalog-normalization|catalog-source-policy)\.test\.mjs)$' | grep -q .; then
            echo "Catalog PR contains changes outside the approved scope." >&2
            exit 1
          fi

      - name: Validate, generate, and check Pages catalog
        if: ${{ startsWith(github.head_ref, 'catalog/publish/') }}
        shell: bash
        run: |
          set -euo pipefail

          node scripts/build-pages-catalog.mjs
          node scripts/build-pages-catalog.mjs --check

      - name: Run Phase 1 catalog tests
        if: ${{ startsWith(github.head_ref, 'catalog/publish/') }}
        shell: bash
        run: |
          set -euo pipefail

          node --test \
            tests/frontend/pages-catalog-generator.test.mjs \
            tests/frontend/catalog-api-client.test.mjs \
            tests/frontend/catalog-normalization.test.mjs \
            tests/frontend/catalog-source-policy.test.mjs
