<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Превью сайта доставки товаров</title>
  <desc id="desc">Темная витрина локальной доставки с ассортиментом, зонами и быстрым заказом.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080b12"/><stop offset=".6" stop-color="#111827"/><stop offset="1" stop-color="#2a180d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset=".5" stop-color="#ef233c"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="230" cy="170" r="180" fill="#f59e0b" opacity=".2" filter="url(#glow)"/>
  <circle cx="1050" cy="600" r="190" fill="#ef233c" opacity=".2" filter="url(#glow)"/>
  <rect x="88" y="72" width="1104" height="576" rx="36" fill="#0d1424" stroke="#fff" stroke-opacity=".12"/>
  <rect x="132" y="116" width="1016" height="72" rx="24" fill="#050812"/>
