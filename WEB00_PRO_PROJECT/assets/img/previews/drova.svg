  <text x="162" y="274" fill="#fff" font-family="Arial, sans-serif" font-size="54" font-weight="800">Доставка и заказ</text>
  <text x="166" y="322" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">Ассортимент, прайс и зоны доставки</text>
