<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Превью сайта массажиста</title>
  <desc id="desc">Темный сайт услуг массажа с записью, блоком доверия и отзывами.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090814"/><stop offset=".55" stop-color="#151225"/><stop offset="1" stop-color="#281728"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset=".5" stop-color="#ff2d55"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="220" cy="160" r="180" fill="#f472b6" opacity=".2" filter="url(#glow)"/>
  <circle cx="1060" cy="610" r="210" fill="#8b5cf6" opacity=".22" filter="url(#glow)"/>
  <rect x="88" y="72" width="1104" height="576" rx="36" fill="#0d1424" stroke="#fff" stroke-opacity=".12"/>
  <rect x="132" y="116" width="1016" height="68" rx="22" fill="#050812"/>
  <text x="166" y="158" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="800">Массаж</text>
  <rect x="168" y="242" width="390" height="268" rx="34" fill="#111827" stroke="#fff" stroke-opacity=".1"/>
  <text x="206" y="314" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="800">Запись на массаж</text>
  <text x="208" y="358" fill="#94a3b8" font-family="Arial, sans-serif" font-size="23">Услуги, цены и доверие</text>
  <rect x="208" y="404" width="170" height="48" rx="24" fill="url(#accent)"/>
  <text x="250" y="435" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Записаться</text>
  <g transform="translate(650 222)">
    <rect width="360" height="290" rx="40" fill="#151f32" stroke="#fff" stroke-opacity=".1"/>
    <ellipse cx="180" cy="112" rx="90" ry="42" fill="#fed7e2" opacity=".88"/>
    <circle cx="116" cy="100" r="24" fill="#fed7e2"/>
    <rect x="92" y="164" width="176" height="24" rx="12" fill="#fff" opacity=".18"/>
    <rect x="92" y="206" width="126" height="18" rx="9" fill="#fff" opacity=".12"/>
  </g>
  <g transform="translate(686 548)">
    <rect width="92" height="18" rx="9" fill="#fff" opacity=".16"/><rect x="116" width="92" height="18" rx="9" fill="#fff" opacity=".16"/><rect x="232" width="92" height="18" rx="9" fill="#fff" opacity=".16"/>
  </g>
</svg>
