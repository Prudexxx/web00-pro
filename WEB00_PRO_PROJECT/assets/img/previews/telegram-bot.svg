    <rect x="44" y="104" width="102" height="16" rx="8" fill="#fff" opacity=".16"/>
  </g>
  <path d="M365 360h100" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/><path d="M454 342l28 18-28 18" fill="none" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(500 280)">
    <rect width="190" height="160" rx="30" fill="#101827" stroke="#fff" stroke-opacity=".12"/>
