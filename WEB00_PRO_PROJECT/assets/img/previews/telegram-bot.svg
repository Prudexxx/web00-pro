    <rect x="44" y="104" width="102" height="16" rx="8" fill="#ef233c" opacity=".76"/>
  </g>
  <path d="M715 360h100" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/><path d="M804 342l28 18-28 18" fill="none" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(850 248)">
