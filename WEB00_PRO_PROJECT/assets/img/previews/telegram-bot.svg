<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Превью Telegram-бота для заявок</title>
  <desc id="desc">Темная схема автоматизации: сайт, заявка, Telegram, таблица и запуск.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050812"/><stop offset=".62" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset=".45" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ef233c"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1020" cy="150" r="190" fill="#8b5cf6" opacity=".26" filter="url(#glow)"/>
  <circle cx="230" cy="610" r="190" fill="#3b82f6" opacity=".2" filter="url(#glow)"/>
  <rect x="88" y="72" width="1104" height="576" rx="36" fill="#0d1424" stroke="#fff" stroke-opacity=".12"/>
  <text x="148" y="156" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-weight="800">Telegram-бот для заявок</text>
  <text x="150" y="198" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">Клиент оставляет заявку, владелец получает уведомление</text>
  <g transform="translate(150 280)">
