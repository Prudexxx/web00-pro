    <text x="36" y="65" class="serif red" font-size="24" font-weight="700">1</text>
    <text x="96" y="48" class="sans dark" font-size="17" font-weight="700">Выбрать</text>
    <text x="96" y="70" class="sans muted" font-size="13">Из каталога готовых решений под вашу нишу.</text>
    <line x1="360" y1="55" x2="465" y2="55" stroke="#d8d0c8"/>
    <circle cx="540" cy="55" r="26" class="soft" stroke="#e5ded6"/>
    <text x="531" y="65" class="serif red" font-size="24" font-weight="700">2</text>
    <text x="592" y="48" class="sans dark" font-size="17" font-weight="700">Проверить</text>
