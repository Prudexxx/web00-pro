<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 900" role="img" aria-label="WEB00 mobile homepage preview">
  <defs>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:Arial,Helvetica,sans-serif}.dark{fill:#201d1a}.muted{fill:#6f6862}.red{fill:#9f1118}.line{stroke:#e8e2da;stroke-width:1}.soft{fill:#f8f5ef}
    </style>
  </defs>
  <rect width="430" height="900" fill="#fffdfb"/>
  <rect x="0" y="0" width="430" height="76" fill="#fffdfb"/>
  <line x1="0" y1="76" x2="430" y2="76" class="line"/>
  <text x="24" y="48" class="serif dark" font-size="34" font-weight="700">WEB</text>
  <text x="99" y="48" class="serif red" font-size="34" font-weight="700">00</text>
  <rect x="355" y="20" width="48" height="40" rx="12" fill="#fff" stroke="#e5ded6"/>
  <line x1="369" y1="32" x2="389" y2="32" stroke="#201d1a" stroke-width="2"/>
  <line x1="369" y1="40" x2="389" y2="40" stroke="#201d1a" stroke-width="2"/>
  <line x1="369" y1="48" x2="389" y2="48" stroke="#201d1a" stroke-width="2"/>

  <g transform="translate(24 120)">
