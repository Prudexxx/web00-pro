    <rect x="0" y="240" width="176" height="54" rx="4" fill="#9f1118"/>
    <text x="42" y="274" class="sans" fill="#fff" font-size="15" font-weight="700">Выбрать сайт</text>
    <rect x="188" y="240" width="160" height="54" rx="4" fill="#fff" stroke="#9f1118"/>
    <text x="226" y="274" class="sans red" font-size="15" font-weight="700">Демо</text>
  </g>

  <g transform="translate(0 440)">
    <line x1="0" y1="0" x2="430" y2="0" class="line"/>
    <line x1="24" y1="96" x2="406" y2="96" class="line"/>
    <line x1="24" y1="192" x2="406" y2="192" class="line"/>
    <line x1="24" y1="288" x2="406" y2="288" class="line"/>
    <circle cx="72" cy="48" r="20" fill="none" stroke="#9f1118" stroke-width="3"/>
    <text x="122" y="43" class="sans dark" font-size="18" font-weight="700">Запуск от 48 часов</text>
    <text x="122" y="68" class="sans muted" font-size="14">Быстрый старт без потери качества</text>
    <path d="M52 155a22 22 0 0 1 44 0" fill="none" stroke="#9f1118" stroke-width="4"/>
    <text x="122" y="139" class="sans dark" font-size="18" font-weight="700">Performance 90+</text>
    <text x="122" y="164" class="sans muted" font-size="14">Скорость и стабильность</text>
    <circle cx="72" cy="240" r="21" fill="none" stroke="#9f1118" stroke-width="3"/>
    <line x1="88" y1="256" x2="106" y2="274" stroke="#9f1118" stroke-width="3"/>
    <text x="122" y="235" class="sans dark" font-size="18" font-weight="700">SEO-ready</text>
    <text x="122" y="260" class="sans muted" font-size="14">Готовность к продвижению</text>
    <path d="M52 350v-12a20 20 0 0 1 40 0v12" fill="none" stroke="#9f1118" stroke-width="4"/>
    <text x="122" y="331" class="sans dark" font-size="18" font-weight="700">Поддержка</text>
