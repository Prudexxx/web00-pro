    <path d="M15 10l2 5h5l-4 3 2 5-5-3-5 3 2-5-4-3h5z" fill="none" stroke="#9f1118" stroke-width="1.3"/>
    <text x="0" y="88" class="serif dark" font-size="34" font-weight="700">Готовый сайт для бизнеса —</text>
